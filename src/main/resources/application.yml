spring:
  application:
    name: SpringbootProjectApplicationDevelopment
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    url: jdbc:mysql://localhost:3306/springbootappdevelopment
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQL8Dialect
#  profiles:
#    active:
#    - test
logging:
  file:
    name: C:/Users/Home/Desktop/logs/springbootappdevelopment.log
management:
  tracing:
    sampling:
      probability: 1.0
mvc:
 pathmatch:
 matching-strategy : ANT_PATH_MATCHER
server:
  port: 2024